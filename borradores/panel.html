<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel de control</title>
<style>
  :root {
    --fondo: #07080c; --vidrio: rgba(28, 31, 40, .72); --vidrio-2: rgba(40, 44, 56, .55);
    --borde: rgba(255, 255, 255, .09); --texto: #e8eaf0; --tenue: #8a90a2;
    --azul: #9fb2e8; --azul-fuerte: #6f86d6; --rojo: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--texto);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 600px at 55% 35%, rgba(70, 120, 220, .35), transparent 70%),
      radial-gradient(700px 500px at 45% 95%, rgba(90, 70, 200, .30), transparent 70%),
      var(--fondo);
    padding: 32px 16px;
  }
  .app {
    max-width: 1640px; margin: 0 auto; padding: 16px;
    background: rgba(14, 16, 22, .82); border: 1px solid var(--borde); border-radius: 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(18px);
  }
  .vidrio {
    background: linear-gradient(180deg, var(--vidrio-2), var(--vidrio));
    border: 1px solid var(--borde); border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  }
  /* Barra superior */
  .barra { display: flex; align-items: center; gap: 16px; padding: 10px 14px; margin-bottom: 14px; }
  .boton-neo.logo-caja { width: 56px; height: 56px; flex: none; background: none; border: 0; box-shadow: none; }
  .boton-neo.logo-caja:active { box-shadow: none; }
  .logo-caja .logo { width: 52px !important; height: 52px !important; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  .logo { width: 44px; height: 44px; flex: none; display: block; }
  .logo .ojos { transform-origin: 32px 51px; animation: parpadeo 5s infinite; }
  @keyframes parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  nav { flex: 1; display: flex; justify-content: center; gap: 4px; }
  nav a { color: var(--tenue); text-decoration: none; font-size: .92rem; padding: 7px 14px; border-radius: 9px; }
  nav a.activo { color: var(--texto); background: rgba(255,255,255,.08); box-shadow: inset 0 -2px 0 var(--azul); }
  /* Botones de perfil y notificaciones (estilo neumórfico en oscuro) */
  .boton-neo { position: relative; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: #e8eaf0;
    background: linear-gradient(145deg, #262a35, #1a1d25); border: 1px solid rgba(255,255,255,.07);
    box-shadow: 4px 4px 10px rgba(0,0,0,.55), -3px -3px 8px rgba(255,255,255,.04), inset 0 1px 0 rgba(255,255,255,.06); transition: transform .15s, box-shadow .15s; }
  .boton-neo:hover { transform: translateY(-1px); }
  .boton-neo:active { box-shadow: inset 3px 3px 7px rgba(0,0,0,.6), inset -2px -2px 6px rgba(255,255,255,.04); transform: none; }
  .boton-neo svg { width: 22px; height: 22px; }
  .insignia { position: absolute; top: -5px; right: -5px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: #e8eaf0; color: #111;
    font-size: .6rem; font-weight: 800; display: grid; place-items: center; border: 2px solid #20232c; }
  .ondas { opacity: 0; transition: opacity .2s; }
  .campana-btn:hover .ondas { opacity: 1; }
  .campana-btn:hover .badajo { transform-origin: 12px 3px; animation: sonar .6s ease-in-out; }
  @keyframes sonar { 0%,100% { transform: rotate(0); } 25% { transform: rotate(12deg); } 50% { transform: rotate(-10deg); } 75% { transform: rotate(6deg); } }



  /* Distribución */
  .rejilla { display: grid; grid-template-columns: 1fr 260px; gap: 14px; }
  .lateral { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  .lateral h3, .seccion h3 { margin: 0; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chip { font-size: .7rem; color: var(--tenue); background: rgba(255,255,255,.07); padding: 2px 7px; border-radius: 6px; }
  .tit { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--tenue); }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; font-size: .88rem; }
  .item.sel { background: rgba(255,255,255,.07); border: 1px solid var(--borde); }
  .caja { width: 15px; height: 15px; border: 1.5px solid #5b6275; border-radius: 4px; flex: none; }
  .item.sel .caja { border-color: var(--azul); background: rgba(159,178,232,.2); }
  .punto-rojo { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; background: var(--rojo); font-size: .65rem; display: grid; place-items: center; }
  .sub { display: block; font-size: .72rem; color: var(--tenue); }
  hr { border: 0; border-top: 1px solid var(--borde); margin: 0; }
  .actividad { display: flex; gap: 10px; align-items: center; font-size: .86rem; margin-top: 10px; }
  .ico { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.07); display: grid; place-items: center; font-size: .8rem; flex: none; }
  .accesos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .acceso { aspect-ratio: 1 / 1.1; display: grid; place-items: center; align-content: center; gap: 6px; font-size: .74rem; border-radius: 14px; }
  .acceso span { font-size: 1.2rem; }

  .principal { display: flex; flex-direction: column; gap: 14px; }
  .encabezado { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 0; }
  .encabezado h2 { margin: 0; font-size: 1.35rem; font-weight: 600; }
  .boton { color: var(--texto); background: rgba(255,255,255,.05); border: 1px solid var(--borde); border-radius: 10px; padding: 7px 14px; font-size: .85rem; }
  .tarjetas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .tarjeta { padding: 14px 16px; min-height: 150px; display: flex; flex-direction: column; }
  .tarjeta .tit { margin: 0; font-size: .82rem; }
  .cifra { font-size: 1.6rem; font-weight: 600; margin: 4px 0 6px; }
  .tarjeta svg { margin-top: auto; }
  .ejes { display: flex; justify-content: space-between; font-size: .62rem; color: var(--tenue); margin-top: 4px; }
  .anillo { display: grid; place-items: center; margin-top: auto; }

  .seccion { padding: 16px; }
  .fases { display: flex; gap: 4px; margin: 14px 0 8px; }
  .fases i { flex: 1; height: 6px; border-radius: 4px; background: rgba(255,255,255,.1); }
  .fases i.ok { background: var(--azul); }
  .fases-nombres { display: flex; justify-content: space-between; font-size: .72rem; color: var(--tenue); }
  .selector { font-size: .78rem; color: var(--tenue); border: 1px solid var(--borde); border-radius: 8px; padding: 4px 10px; }
  .inferior { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  .pendiente { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 12px; margin-top: 10px; background: rgba(255,255,255,.03); font-size: .88rem; }
  .pendiente .check { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; background: var(--azul-fuerte); display: grid; place-items: center; font-size: .65rem; }
  .pendiente .info { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--tenue); display: grid; place-items: center; font-size: .65rem; color: var(--tenue); }

  @media (max-width: 860px) {
    .rejilla, .inferior, .tarjetas { grid-template-columns: 1fr; }
    nav { display: none; }
  }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi { display: flex; gap: 12px; align-items: center; padding: 14px 16px; }
  .kpi-ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--c);
    background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); font-weight: 700; }
  .kpi-num { font-size: 1.35rem; font-weight: 600; }
  .kpi-txt { font-size: .76rem; color: var(--tenue); white-space: nowrap; }
  .tablero-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  .vistas { display: flex; gap: 2px; background: rgba(255,255,255,.04); border: 1px solid var(--borde); border-radius: 9px; padding: 3px; }
  .vista { font-size: .78rem; color: var(--tenue); padding: 4px 10px; border-radius: 7px; cursor: pointer; }
  .vista.activa { background: rgba(255,255,255,.09); color: var(--texto); }
  .acciones { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .buscar, .filtro { background: rgba(255,255,255,.04); border: 1px solid var(--borde); color: var(--texto); border-radius: 9px; padding: 7px 10px; font: inherit; font-size: .82rem; }
  .buscar { width: 170px; } .filtro option { background: #1c1f28; }
  .nuevo-btn { background: linear-gradient(180deg, #8d7cf5, #6c5ce7); color: #fff; border: 0; border-radius: 9px; padding: 7px 14px; font: inherit; font-size: .82rem; cursor: pointer; }
  .tablero { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .columna { background: rgba(0,0,0,.22); border: 1px solid var(--borde); border-radius: 14px; padding: 10px; min-height: 260px; transition: background .15s; }
  .columna.encima { background: rgba(159,178,232,.08); border-color: var(--azul); }
  .columna h4 { margin: 2px 4px 10px; font-size: .88rem; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .columna h4 .chip.rojo { background: rgba(229,72,77,.2); color: #ff8a8e; }
  .ficha { background: linear-gradient(180deg, rgba(48,52,66,.7), rgba(34,37,48,.7)); border: 1px solid var(--borde); border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: grab; font-size: .82rem; }
  .ficha.borde-curso { border-left: 3px solid #7c6cf0; } .ficha.borde-vencido { border-left: 3px solid var(--rojo); }
  .ficha:active { cursor: grabbing; }
  .ficha-top { display: flex; justify-content: space-between; align-items: center; color: var(--tenue); font-size: .72rem; margin-bottom: 8px; }
  .prio { font-size: .68rem; padding: 2px 7px; border-radius: 6px; font-weight: 600; }
  .prio.alta { background: rgba(229,72,77,.18); color: #ff8a8e; } .prio.media { background: rgba(245,158,11,.18); color: #f5b84b; } .prio.baja { background: rgba(63,182,122,.18); color: #5fd49a; }
  .ficha-nombre { font-weight: 600; font-size: .9rem; margin-bottom: 10px; line-height: 1.3; }
  .barra-prog { height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); margin-bottom: 10px; overflow: hidden; }
  .barra-prog i { display: block; height: 100%; background: var(--azul); }
  .fecha { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--borde); border-radius: 7px; padding: 3px 8px; font-size: .72rem; color: var(--tenue); }
  .fecha.vencida { color: #ff8a8e; border-color: rgba(229,72,77,.4); background: rgba(229,72,77,.08); }
  .ficha-pie { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--tenue); font-size: .74rem; }
  .avatares { display: flex; } .avatares span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .6rem; font-weight: 700; color: #111; margin-right: -6px; border: 2px solid #262a36; }
  .vacia { color: var(--tenue); font-size: .78rem; text-align: center; padding: 20px 0; }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } .tablero { grid-template-columns: 1fr; } .acciones { margin-left: 0; } }

  [hidden] { display: none !important; }
  /* Etiquetas de estado */
  .estado-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; border-radius: 999px; font-size: .7rem; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .estado-pill svg { width: 13px; height: 13px; flex: none; }
  .e-listo { color: #2ee6b0; background: #03211a; border-color: #0f4d3b; }
  .e-en_curso { color: #ffd45c; background: #241904; border-color: #4d3a0f; }
  .e-vencido { color: #ffb3e0; background: #3a0e27; border-color: #6e1d48; }
  .e-sin_empezar { color: #b4bac8; background: #1f222a; border-color: #3a3e4a; }
  /* Línea de color a la izquierda de cada tarjeta, como en las alertas */
  .ficha { position: relative; padding-left: 18px !important; }
  .ficha::before { content: ""; position: absolute; left: 8px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--acento); box-shadow: 0 0 10px var(--acento); }
  /* Todo el recuadro se tiñe del color de su línea, como en las alertas */
  .a-listo, .t-listo { --acento: #2ee6b0; --tinte: 46, 230, 176; }
  .a-en_curso, .t-en_curso { --acento: #ffd45c; --tinte: 255, 200, 70; }
  .a-sin_empezar, .t-sin_empezar { --acento: #9aa1b4; --tinte: 154, 161, 180; }
  .ficha, .kpi {
    background: linear-gradient(115deg, rgba(var(--tinte), .16) 0%, rgba(var(--tinte), .05) 55%, rgba(20, 22, 30, .85) 100%) !important;
    border: 1px solid rgba(var(--tinte), .28) !important; border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 24px rgba(var(--tinte), .06);
  }
  .kpi { position: relative; padding-left: 22px !important; }
  .kpi::before { content: ""; position: absolute; left: 10px; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--acento); box-shadow: 0 0 10px var(--acento); }
  .kpi .kpi-ico { --c: var(--acento); }
  .kpi-ico svg { width: 20px; height: 20px; }
  /* Solo 2 proyectos a la vista por columna; el resto con la rueda del ratón */
  .col-lista { max-height: 236px; overflow-y: auto; padding-right: 4px; margin-right: -4px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
  .col-lista::-webkit-scrollbar { width: 6px; } .col-lista::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 6px; }
  .columna { min-height: 0 !important; }
  /* Tarjeta de proyecto estilo "lead card" */
  .ficha { padding: 14px 14px 14px 20px !important; }
  .fx-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
  .fx-titulo { font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; line-height: 1.3; }
  .fx-persona { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .fx-avatares { display: flex; flex: none; }
  .fx-avatares span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: .68rem; font-weight: 700; color: #141620;
    margin-right: -10px; border: 2px solid rgba(255,255,255,.25); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .fx-avatares span:last-child { margin-right: 0; }
  .fx-avatares .nadie { background: rgba(255,255,255,.08); color: var(--tenue); border-style: dashed; }
  .fx-quien { min-width: 0; }
  .fx-quien b { display: block; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fx-quien small { display: block; font-size: .72rem; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prio-txt { text-transform: none; } .prio-txt.alta { color: #ff8a8e; } .prio-txt.media { color: #f5c06a; } .prio-txt.baja { color: #6ee0a7; }
  .rojo-txt { color: #ff8a8e; }
  .fx-medio { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
  .fx-chip { font-size: .68rem; color: var(--tenue); background: rgba(255,255,255,.07); border: 1px solid var(--borde); border-radius: 6px; padding: 3px 7px; }
  .fx-pct { font-size: 1.7rem; font-weight: 700; line-height: 1; color: var(--acento); text-shadow: 0 0 18px rgba(var(--tinte), .35); }
  .fx-barra { height: 9px; border-radius: 9px; background: rgba(255,255,255,.07); overflow: hidden; }
  .fx-barra i { display: block; height: 100%; min-width: 4px; border-radius: 9px; background: linear-gradient(90deg, rgba(var(--tinte), .55), var(--acento)); box-shadow: 0 0 10px rgba(var(--tinte), .5); }
  /* Barra del tablero: todo en una sola fila y con la misma altura */
  .tablero-barra { flex-wrap: nowrap !important; gap: 10px !important; }
  .tablero-barra h3 { white-space: nowrap; font-size: .95rem; margin: 0; display: flex; align-items: center; height: 34px; }
  .vistas, .buscar, .filtro, .nuevo-btn { height: 34px; box-sizing: border-box; }
  .vistas { align-items: center; flex: none; }
  .vista { white-space: nowrap; height: 26px; display: flex; align-items: center; }
  .acciones { flex-wrap: nowrap !important; align-items: center; }
  .buscar { width: 150px !important; padding-top: 0 !important; padding-bottom: 0 !important; }
  .filtro { padding-top: 0 !important; padding-bottom: 0 !important; }
  .nuevo-btn { white-space: nowrap; display: flex; align-items: center; padding-top: 0 !important; padding-bottom: 0 !important; }
  @media (max-width: 1500px) {
    .tablero-barra { flex-wrap: wrap !important; }
    .acciones { width: 100%; margin-left: 0 !important; }
    .buscar { flex: 1; width: auto !important; min-width: 0; }
  }
  /* Calendario nuevo */
  .cal-layout { display: grid; grid-template-columns: 1fr 240px; gap: 22px; }
  .cal-cab { display: flex !important; justify-content: space-between; align-items: center; margin-bottom: 14px !important; }
  .cal-cab b { font-size: 1.1rem !important; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav .cal-btn { height: 32px; min-width: 32px; display: grid; place-items: center; }
  .cal { gap: 8px !important; }
  .cal-dia-nom { padding-bottom: 6px !important; }
  .cal-dia { min-height: 0 !important; aspect-ratio: 1 / .82; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 0 !important; font: inherit; font-size: .85rem !important; color: var(--texto); cursor: pointer;
    background: linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.015)) !important; border: 1px solid var(--borde) !important; border-radius: 12px !important; transition: border-color .15s, background .15s; }
  .cal-dia:hover { border-color: rgba(159,178,232,.4) !important; }
  .cal-dia.hoy span { color: var(--azul); font-weight: 700; }
  .cal-dia.hoy { box-shadow: none !important; }
  .cal-dia.sel { background: linear-gradient(145deg, rgba(141,124,245,.35), rgba(108,92,231,.15)) !important; border-color: #8d7cf5 !important; box-shadow: 0 0 18px rgba(141,124,245,.25) !important; }
  .cal-puntos { display: flex; gap: 3px; height: 6px; }
  .cal-puntos i { width: 6px; height: 6px; border-radius: 50%; }
  .cp-sin_empezar { background: #9aa1b4; } .cp-en_curso { background: #ffd45c; } .cp-listo { background: #2ee6b0; }
  .cal-lado h4 { margin: 4px 0 14px; font-size: .95rem; }
  .cal-item { position: relative; padding: 12px 12px 12px 18px; border-radius: 12px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; justify-content: space-between;
    background: linear-gradient(115deg, rgba(var(--tinte), .16), rgba(20,22,30,.85)); border: 1px solid rgba(var(--tinte), .28); }
  .cal-item::before { content: ""; position: absolute; left: 8px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--acento); }
  .cal-item b { font-size: .86rem; } .cal-item small { width: 100%; color: var(--tenue); font-size: .72rem; }
  .cal-vacio { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--tenue); font-size: .82rem; text-align: center; padding: 30px 0; }
  .cal-vacio svg { width: 40px; height: 40px; color: rgba(159,178,232,.5); }
  @media (max-width: 1000px) { .cal-layout { grid-template-columns: 1fr; } }
  .principal { min-width: 0; }
  #listaTareas .item { cursor: pointer; align-items: flex-start; }
  #listaTareas .item .caja { margin-top: 2px; }
  #listaTareas .item.hecha .caja { background: #2ee6b0; border-color: #2ee6b0; }
  #listaTareas .item.hecha .t-texto { text-decoration: line-through; color: var(--tenue); }
  #listaTareas { max-height: 260px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
  /* ===== Pulido de UX ===== */
  :root { --tenue: #9aa0b2; }
  /* Menos cajas dentro de cajas: las columnas ya no llevan recuadro propio */
  .columna { background: transparent !important; border: 0 !important; padding: 0 !important; }
  .columna.encima .col-lista { outline: 2px dashed rgba(141,124,245,.6); outline-offset: 4px; border-radius: 14px; }
  .columna h4 { margin: 0 2px 12px !important; }
  .tablero { gap: 18px !important; }
  /* Tarjetas: respuesta al pasar el ratón y foco visible con teclado */
  .ficha { transition: transform .15s ease, box-shadow .15s ease; }
  .ficha:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.35), 0 0 24px rgba(var(--tinte), .12); }

<script>
  // ===== VISTA PREVIA: copia de tus proyectos reales (6 oct 2026). NO está conectada a Supabase:

  const HOY = new Date().toISOString().slice(0, 10);
  const COLORES = { Ariana: "#f4a6c1", Carlos: "#9fd3f0", Pierina: "#c3b5f7", Hilary: "#f7d38b" };
  const mapaP = new Map(), mapaT = new Map();
  const COPIA_PROYECTOS = [{"id": 1, "nombre": "PODCAST", "estado": "listo", "prioridad": "media", "encargados": ["Pierina", "Carlos", "Hilary"], "fecha_limite": null, "created_at": "2026-10-06T16:27:47.588971+00:00"}, {"id": 2, "nombre": "MAILING", "estado": "listo", "prioridad": "media", "encargados": [], "fecha_limite": null, "created_at": "2026-10-06T16:27:55.618877+00:00"}, {"id": 3, "nombre": "programa de puntos", "estado": "sin_empezar", "prioridad": "media", "encargados": ["Ariana"], "fecha_limite": null, "created_at": "2026-10-06T16:29:11.698363+00:00"}, {"id": 4, "nombre": "Diseño", "estado": "en_curso", "prioridad": "alta", "encargados": ["Ariana"], "fecha_limite": "2026-10-23", "created_at": "2026-10-06T16:29:28.305491+00:00"}, {"id": 5, "nombre": "ia para legal", "estado": "sin_empezar", "prioridad": "media", "encargados": [], "fecha_limite": "2026-10-27", "created_at": "2026-10-06T16:31:29.879376+00:00"}];
  const COPIA_TAREAS = [{"id": 1, "proyecto_id": 4, "texto": "Flyer/video halloween", "hecha": false, "created_at": "2026-10-06T16:29:45.326742+00:00"}, {"id": 5, "proyecto_id": 2, "texto": "a", "hecha": true, "created_at": "2026-10-06T19:07:02.691042+00:00"}];

  COPIA_TAREAS.forEach((x) => mapaT.set(x.id, x));
  let proyectos = [];
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Junta proyectos con el conteo de sus tareas
  // Lista de tareas de la columna derecha (pendientes primero)
  function pintarTareas() {
    const cont = document.getElementById("listaTareas");
    const lista = [...mapaT.values()].sort((a, b) => a.hecha - b.hecha || a.created_at.localeCompare(b.created_at));
    nTareas.textContent = lista.filter((t) => !t.hecha).length;
    cont.innerHTML = lista.length ? "" : `<div class="vacia">No hay tareas todavía</div>`;
    for (const t of lista) {
      const pr = mapaP.get(t.proyecto_id);
      const it = document.createElement("div");
      it.className = "item" + (t.hecha ? " hecha" : "");
      it.innerHTML = `<div class="caja"></div><div><span class="t-texto">${esc(t.texto)}</span><span class="sub">${pr ? esc(pr.nombre) : ""}</span></div>`;
      it.onclick = () => { t.hecha = !t.hecha; armar(); }; // solo en esta vista previa
      cont.append(it);
    }
  }

  // Vencen pronto: proyectos sin terminar que vencen en los próximos 7 días (o ya vencieron)
  function pintarPronto() {
    const limite = new Date(); limite.setDate(limite.getDate() + 7);
    const lim = isoDe(limite);
    const lista = [...mapaP.values()].filter((p) => p.fecha_limite && p.estado !== "listo" && p.fecha_limite <= lim)
      .sort((a, b) => a.fecha_limite.localeCompare(b.fecha_limite));
    nPronto.textContent = lista.length;
    listaPronto.innerHTML = lista.length ? "" : `<div class="pronto-ok">Nada vence en los próximos 7 días.</div>`;
    for (const p of lista) {
      const dias = Math.round((new Date(p.fecha_limite + "T00:00") - new Date(HOY + "T00:00")) / 864e5);
      const cuando = dias < 0 ? `Venció hace ${-dias} día${dias === -1 ? "" : "s"}` : dias === 0 ? "Vence hoy" : dias === 1 ? "Vence mañana" : `Vence en ${dias} días`;
      const it = document.createElement("button");
      it.className = "pronto a-" + p.estado + (dias <= 1 ? " urgente" : "");
      it.innerHTML = `<b>${esc(p.nombre)}</b><small>${cuando} · ${fmt(p.fecha_limite)}</small>`;
      it.onclick = () => abrirProyecto(p.id);
      listaPronto.append(it);
    }
  }

  // Panel lateral con el detalle del proyecto
  let abiertoId = null;
  function abrirProyecto(id) { abiertoId = id; pintarDetalle(); document.body.classList.add("con-detalle"); }
  function cerrarProyecto() { abiertoId = null; document.body.classList.remove("con-detalle"); }
  function pintarDetalle() {
    const p = mapaP.get(abiertoId);
    if (!p) return cerrarProyecto();
    const tareas = [...mapaT.values()].filter((t) => t.proyecto_id === p.id).sort((a, b) => a.created_at.localeCompare(b.created_at));
    const hechas = tareas.filter((t) => t.hecha).length, pct = tareas.length ? Math.round((hechas / tareas.length) * 100) : 0;
    const d = document.getElementById("detalle");
    d.className = "detalle a-" + p.estado;
    d.innerHTML = `
      <div class="det-cab"><div>${pill(p.estado)}<h2>${esc(p.nombre)}</h2></div><button class="det-cerrar" title="Cerrar (Esc)">✕</button></div>
      <dl class="det-datos">
        <dt>Encargados</dt><dd>${p.encargados.length ? p.encargados.map((n) => `<span class="det-persona"><i style="background:${COLORES[n]}">${n[0]}</i>${n}</span>`).join("") : "Sin encargado"}</dd>
        <dt>Prioridad</dt><dd><span class="prio-txt ${p.prioridad}">${mayus(p.prioridad)}</span></dd>
        <dt>Fecha límite</dt><dd>${p.fecha_limite ? fmt(p.fecha_limite) : "Sin fecha"}</dd>
      </dl>
      <div class="det-prog"><span>${tareas.length ? `${hechas} de ${tareas.length} tareas hechas` : "Aún sin tareas"}</span><b>${tareas.length ? pct + "%" : ""}</b></div>
      <div class="fx-barra"><i style="width:${pct}%"></i></div>
      <h3 class="det-sub">Tareas</h3>
      <div class="det-tareas"></div>
      <form class="det-nueva"><input placeholder="Añadir una tarea y pulsar Enter" /><button>Añadir</button></form>
      <p class="det-nota">Vista previa: los cambios no se guardan.</p>`;
    const lista = d.querySelector(".det-tareas");
    if (!tareas.length) lista.innerHTML = `<div class="pronto-ok">Este proyecto todavía no tiene tareas.</div>`;
    for (const t of tareas) {
      const it = document.createElement("div");
      it.className = "item" + (t.hecha ? " hecha" : "");
      it.innerHTML = `<div class="caja"></div><span class="t-texto">${esc(t.texto)}</span>`;
      it.onclick = () => { t.hecha = !t.hecha; armar(); };
      lista.append(it);
    }
    d.querySelector(".det-cerrar").onclick = cerrarProyecto;
    d.querySelector(".det-nueva").onsubmit = (e) => {
      e.preventDefault();
      const v = e.target.querySelector("input").value.trim();
      if (!v) return;
      const id = Date.now();
      mapaT.set(id, { id, proyecto_id: p.id, texto: v, hecha: false, created_at: new Date().toISOString() });
      armar();
      document.querySelector("#detalle .det-nueva input").focus();
    };
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarProyecto(); });

  function armar() {
    pintarTareas();
    pintarPronto();
    if (abiertoId !== null) pintarDetalle();
    const tareas = [...mapaT.values()];
    proyectos = [...mapaP.values()].sort((a, b) => a.created_at.localeCompare(b.created_at)).map((p) => {
      const suyas = tareas.filter((t) => t.proyecto_id === p.id);
      return { ...p, fecha: p.fecha_limite || "", hechas: suyas.filter((t) => t.hecha).length, total: suyas.length };
    });
    pintar();
  }
  const ICONOS = {
    listo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>',
    en_curso: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1"/></svg>',
    vencido: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="m9 9 6 6M15 9l-6 6"/></svg>',
    sin_empezar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><circle cx="12" cy="12" r="9"/></svg>',
  };
  const ETIQUETA = { sin_empezar: "Sin empezar", en_curso: "En curso", listo: "Listo", vencido: "Vencido" };
  document.querySelectorAll("[data-ico]").forEach((d) => (d.innerHTML = ICONOS[d.dataset.ico]));
  const pill = (e) => `<span class="estado-pill e-${e}">${ICONOS[e]}${ETIQUETA[e]}</span>`;
  const COLUMNAS = [
    { id: "sin_empezar", titulo: "Sin empezar" },
    { id: "en_curso", titulo: "En curso" },
    { id: "listo", titulo: "Listo" },
  ];
  const vencido = (p) => p.fecha && p.fecha < HOY && p.estado !== "listo";
  const columnaDe = (p) => p.estado;
  const fmt = (f) => new Date(f + "T00:00").toLocaleDateString("es", { day: "numeric", month: "short" });
  const filtroSel = document.getElementById("filtro");
  Object.keys(COLORES).forEach((n) => filtroSel.append(new Option(n, n)));

  // Cada columna muestra hasta 3 tarjetas; si hay más, se desliza dentro de la columna
  function ajustarAltoColumnas() {
    const fichas = [...document.querySelectorAll("#tablero .ficha")];
    if (!fichas.length) return;
    const alto = Math.max(...fichas.map((f) => f.offsetHeight));
    document.querySelectorAll("#tablero .col-lista").forEach((c) => {
      c.style.minHeight = alto * 3 + 12 * 2 + 12 + "px";
      c.parentElement.querySelector(".mas")?.remove();
      if (c.scrollHeight > c.clientHeight + 2) c.insertAdjacentHTML("afterend", `<div class="mas">↕ Desliza para ver más</div>`);
    });
  }
  addEventListener("resize", () => vistaActual === "kanban" && ajustarAltoColumnas());

  function pintar() {
    const q = document.getElementById("buscar").value.toLowerCase();
    const quien = filtroSel.value;
    const visibles = proyectos.filter((p) => p.nombre.toLowerCase().includes(q) && (!quien || p.encargados.includes(quien)));

    // Indicadores
    const total = proyectos.reduce((a, p) => a + p.total, 0), hechas = proyectos.reduce((a, p) => a + p.hechas, 0);
    kActivos.textContent = proyectos.filter((p) => p.estado !== "listo").length;
    kTareasOk.textContent = hechas;
    kListos.textContent = proyectos.filter((p) => p.estado === "listo").length;
    kPend.textContent = total - hechas;

    for (const v of ["tablero", "linea", "calendario"]) document.getElementById(v).hidden = true;
    if (vistaActual === "linea") return pintarLinea(visibles);
    if (vistaActual === "calendario") return pintarCalendario(visibles);
    const tablero = document.getElementById("tablero");
    tablero.hidden = false;
    tablero.innerHTML = "";
    for (const c of COLUMNAS) {
      const lista = visibles.filter((p) => columnaDe(p) === c.id);
      const col = document.createElement("div");
      col.className = "columna";
      col.innerHTML = `<h4>${pill(c.id)} <span class="chip">${lista.length}</span></h4>`;
      const caja = document.createElement("div");
      caja.className = "col-lista";
      col.append(caja);
      if (!lista.length) caja.innerHTML = `<div class="vacia">Arrastra un proyecto aquí</div>`;
      for (const p of lista) {
        const pct = p.total ? Math.round((p.hechas / p.total) * 100) : 0;
        const f = document.createElement("div");
        f.className = "ficha a-" + c.id;
        f.draggable = true;
        f.tabIndex = 0;
        f.title = "Clic para abrir · arrastra para cambiar de estado";
        const nombres = p.encargados.length ? p.encargados.join(", ") : "Sin encargado";
        const fechaTxt = p.fecha ? `${vencido(p) ? "Venció" : "Vence"} ${fmt(p.fecha)}` : "Sin fecha";
        const diasF = p.fecha ? Math.round((new Date(p.fecha + "T00:00") - new Date(HOY + "T00:00")) / 864e5) : null;
        const plazo = diasF === null ? "" : diasF < 0 ? `hace ${-diasF}d` : diasF === 0 ? "hoy" : `${diasF}d`;
        const r = 5.5, cir = 2 * Math.PI * r;
        f.innerHTML = `
          <div class="cx-titulo">${esc(p.nombre)}</div>
          <div class="cx-etiquetas">
            ${p.encargados.length
              ? `<span class="cx-persona"><span class="cx-avs">${p.encargados.map((n) => `<i style="background:${COLORES[n]}">${n[0]}</i>`).join("")}</span>${p.encargados.length === 1 ? p.encargados[0] : p.encargados.length + " personas"}</span>`
              : `<span class="cx-persona vacio">Sin encargado</span>`}
            <span class="cx-prio ${p.prioridad}">${mayus(p.prioridad)}</span>
          </div>
          <div class="cx-meta">
            <span title="Tareas hechas"><i class="cx-caja"></i>${p.hechas}/${p.total}</span>
            <span title="Progreso"><svg width="15" height="15" viewBox="0 0 14 14"><circle cx="7" cy="7" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2"/><circle cx="7" cy="7" r="${r}" fill="none" stroke="var(--acento)" stroke-width="2" stroke-dasharray="${cir}" stroke-dashoffset="${cir * (1 - pct / 100)}" transform="rotate(-90 7 7)" stroke-linecap="round"/></svg>${pct}%</span>
            <span class="cx-fecha ${vencido(p) ? "rojo-txt" : ""}" title="${p.fecha ? "Vence el " + fmt(p.fecha) : "Sin fecha límite"}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${p.fecha ? plazo : "—"}</span>
          </div>`;
        f.ondragstart = (e) => e.dataTransfer.setData("id", p.id);
        f.onclick = () => abrirProyecto(p.id);
        f.onkeydown = (e) => { if (e.key === "Enter") abrirProyecto(p.id); };
        caja.append(f);
      }
      col.ondragover = (e) => { e.preventDefault(); col.classList.add("encima"); };
      col.ondragleave = () => col.classList.remove("encima");
      col.ondrop = (e) => {
        const p = proyectos.find((x) => x.id == e.dataTransfer.getData("id"));
                mapaP.get(p.id).estado = c.id; // solo en esta vista previa
        armar();
      };
      tablero.append(col);
    }
    ajustarAltoColumnas();
  }
  document.getElementById("buscar").oninput = pintar;
  filtroSel.onchange = pintar;
  document.getElementById("nuevoBtn").onclick = () => {
    const nombre = prompt("Nombre del nuevo proyecto:");
    if (nombre && nombre.trim()) {
      mapaP.set(Date.now(), { id: Date.now(), nombre: nombre.trim(), estado: "sin_empezar", prioridad: "media", encargados: [], fecha_limite: null, created_at: new Date().toISOString() });
      armar();
    }
  };

  // ===== Cambiar de vista =====
  let vistaActual = "kanban";
  document.querySelectorAll(".vista").forEach((v) => v.onclick = () => {
    document.querySelectorAll(".vista").forEach((x) => x.classList.remove("activa"));
    v.classList.add("activa");
    vistaActual = v.dataset.v;
    pintar();
  });
  const dia = (f) => new Date(f.slice(0, 10) + "T00:00");
  const NOMBRE_ESTADO = { sin_empezar: "Sin empezar", en_curso: "En curso", listo: "Listo", vencido: "Vencido" };

  // ===== Línea de tiempo: cada proyecto va desde que se creó hasta su fecha límite =====
  function pintarLinea(lista) {
    const cont = document.getElementById("linea");
    cont.hidden = false;
    const conFecha = lista.filter((p) => p.fecha);
    const fechas = [new Date(), ...lista.map((p) => dia(p.created_at)), ...conFecha.map((p) => dia(p.fecha))];
    const ini = new Date(Math.min(...fechas)); ini.setDate(1);
    const fin = new Date(Math.max(...fechas)); fin.setMonth(fin.getMonth() + 1, 1);
    const largo = fin - ini, pos = (d) => ((d - ini) / largo) * 100;

    let meses = "";
    for (let m = new Date(ini); m < fin; m.setMonth(m.getMonth() + 1))
      meses += `<div class="lt-mes" style="left:${pos(m)}%">${m.toLocaleDateString("es", { month: "long", year: "numeric" })}</div>`;
    const hoy = `<div class="lt-hoy" style="left:${pos(new Date())}%" title="Hoy"></div>`;

    let html = `<div class="lt"><div class="lt-fila lt-cab"><div class="lt-nombre"><small>PROYECTO</small></div><div class="lt-pista">${meses}</div></div>`;
    for (const p of lista) {
      const est = p.estado;
      let barra;
      if (p.fecha) {
        const a = pos(dia(p.created_at)), b = pos(new Date(dia(p.fecha).getTime() + 864e5));
        barra = `<div class="lt-barra ${est}" style="left:${a}%;width:${Math.max(b - a, 1.5)}%" title="${esc(p.nombre)}">${esc(p.nombre)}</div>`;
      } else barra = `<div class="lt-sin">Sin fecha límite</div>`;
      html += `<div class="lt-fila"><div class="lt-nombre">${esc(p.nombre)}<small>${NOMBRE_ESTADO[est]} · ${p.hechas}/${p.total} tareas</small></div><div class="lt-pista">${hoy}${barra}</div></div>`;
    }
    if (!lista.length) html += `<div class="vacia">No hay proyectos que mostrar</div>`;
    html += `</div><div class="leyenda"><span><i style="background:#8a90a2"></i>Sin empezar</span><span><i style="background:#ffd45c"></i>En curso</span><span><i style="background:#2ee6b0"></i>Listo</span><span><i style="background:var(--rojo);width:2px"></i>Hoy</span></div>`;
    cont.innerHTML = html;
  }

  // ===== Calendario: solo los días del mes; al elegir un día se ven sus proyectos al costado =====
  let mesCal = new Date(); mesCal.setDate(1);
  let diaSel = HOY;
  const isoDe = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const mayus = (t) => t[0].toUpperCase() + t.slice(1);
  function pintarCalendario(lista) {
    const cont = document.getElementById("calendario");
    cont.hidden = false;
    const y = mesCal.getFullYear(), m = mesCal.getMonth();
    const dias = new Date(y, m + 1, 0).getDate();
    const desfase = (new Date(y, m, 1).getDay() + 6) % 7; // semana empieza en lunes

    let rejilla = "";
    for (const n of ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"]) rejilla += `<div class="cal-dia-nom">${n}</div>`;
    for (let i = 0; i < desfase; i++) rejilla += `<div></div>`;
    for (let d = 1; d <= dias; d++) {
      const iso = isoDe(new Date(y, m, d));
      const suyos = lista.filter((p) => p.fecha === iso);
      const puntos = suyos.slice(0, 3).map((p) => `<i class="cp-${p.estado}"></i>`).join("");
      rejilla += `<button class="cal-dia ${iso === HOY ? "hoy" : ""} ${iso === diaSel ? "sel" : ""} ${suyos.length ? "con" : ""}" data-iso="${iso}">
        <span>${d}</span><div class="cal-puntos">${puntos}</div></button>`;
    }

    const delDia = lista.filter((p) => p.fecha === diaSel);
    const fechaSel = new Date(diaSel + "T00:00").toLocaleDateString("es", { weekday: "long", day: "numeric", month: "long" });
    const lateral = delDia.length
      ? delDia.map((p) => `<div class="cal-item a-${p.estado}"><b>${esc(p.nombre)}</b>${pill(p.estado)}
          <small>${p.encargados.join(", ") || "Sin encargado"} · Prioridad ${p.prioridad}</small></div>`).join("")
      : `<div class="cal-vacio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Sin proyectos que venzan este día</div>`;

    const sinFecha = lista.filter((p) => !p.fecha).length;
    cont.innerHTML = `<div class="cal-layout">
      <div>
        <div class="cal-cab"><b>${mayus(new Date(y, m, 1).toLocaleDateString("es", { month: "long", year: "numeric" }))}</b>
          <div class="cal-nav"><button class="cal-btn" id="calHoy">Hoy</button><button class="cal-btn" id="calPrev">‹</button><button class="cal-btn" id="calNext">›</button></div></div>
        <div class="cal">${rejilla}</div>
        ${sinFecha ? `<div class="nota">${sinFecha} proyecto(s) sin fecha límite no aparecen en el calendario.</div>` : ""}
      </div>
      <aside class="cal-lado"><h4>${mayus(fechaSel)}</h4>${lateral}</aside>
    </div>`;
    cont.querySelectorAll(".cal-dia").forEach((b) => (b.onclick = () => { diaSel = b.dataset.iso; pintar(); }));
    calPrev.onclick = () => { mesCal.setMonth(mesCal.getMonth() - 1); pintar(); };
    calNext.onclick = () => { mesCal.setMonth(mesCal.getMonth() + 1); pintar(); };
    calHoy.onclick = () => { mesCal = new Date(); mesCal.setDate(1); diaSel = HOY; pintar(); };
  }
  armar();
</script>
<div class="velo" onclick="cerrarProyecto()"></div>
<aside id="detalle" class="detalle" aria-label="Detalle del proyecto"></aside>
</body>
</html>
