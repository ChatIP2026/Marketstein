<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proyectos del equipo</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #6b7280;
      --line: #e5e7eb; --accent: #2563eb; --danger: #dc2626; --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 820px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .estado-conexion { font-size: .85rem; color: var(--muted); margin-bottom: 20px; }
    .estado-conexion span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; margin-right: 6px; }
    .estado-conexion.ok span { background: var(--ok); }
    form.nuevo { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text], input[type=date], select {
      padding: 8px 10px; font-size: .95rem; font-family: inherit;
      border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text);
    }
    form.nuevo input { flex: 1; font-size: 1rem; padding: 10px 12px; }
    input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button { padding: 10px 16px; font-size: 1rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; font-family: inherit; }
    button.chico { padding: 8px 12px; font-size: .9rem; }
    button.icono { background: none; color: var(--muted); padding: 4px 8px; font-size: 1.05rem; }
    button.icono:hover { color: var(--danger); }

    .proyecto { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .cabecera { display: flex; align-items: center; gap: 12px; padding: 14px; }
    .flecha { background: none; color: var(--muted); padding: 4px; font-size: .9rem; width: 24px; transition: transform .15s; }
    .abierto .flecha { transform: rotate(90deg); }
    .anillo { flex: none; }
    .anillo text { font-size: 10px; font-weight: 600; fill: var(--text); }
    .nombre { flex: 1; font-weight: 600; font-size: 1.05rem; cursor: text; word-break: break-word; }
    .nombre small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; margin-top: 2px; }

    .propiedades { display: flex; flex-wrap: wrap; gap: 14px 18px; padding: 0 14px 14px 50px; align-items: center; }
    .prop { display: flex; flex-direction: column; gap: 4px; }
    .prop label { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    select.estado-sin_empezar { background: #f3f4f6; }
    select.estado-en_curso { background: #dbeafe; }
    select.estado-listo { background: #dcfce7; }
    select.prio-alta { background: #fee2e2; }
    select.prio-media { background: #fef3c7; }
    select.prio-baja { background: #e0f2fe; }
    input.vencida { border-color: var(--danger); color: var(--danger); }
    .personas { display: flex; flex-wrap: wrap; gap: 6px; }
    .persona { padding: 5px 10px; font-size: .85rem; border-radius: 999px; background: #f3f4f6; color: var(--muted); border: 1px solid var(--line); }
    .persona.activa { background: var(--accent); color: #fff; border-color: var(--accent); }

    .tareas { border-top: 1px solid var(--line); background: #fafbfc; padding: 8px 14px 14px 50px; }
    .tareas ul { list-style: none; margin: 0 0 8px; padding: 0; }
    .tareas li { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .tareas li input[type=checkbox] { width: 17px; height: 17px; cursor: pointer; }
    .tareas .texto { flex: 1; cursor: text; word-break: break-word; }
    .tareas li.hecha .texto { text-decoration: line-through; color: var(--muted); }
    .tareas form { display: flex; gap: 8px; }
    .tareas form input { flex: 1; }
    .vacio { padding: 24px; text-align: center; color: var(--muted); }
    .ayuda { font-size: .8rem; color: var(--muted); margin-top: 12px; }

    @media (max-width: 560px) {
      .propiedades, .tareas { padding-left: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Proyectos del equipo</h1>
    <div class="estado-conexion" id="conexion"><span></span>Conectando…</div>

    <form class="nuevo" id="nuevoProyecto">
      <input type="text" id="nombreProyecto" placeholder="Nuevo proyecto…" autocomplete="off" required />
      <button type="submit">Crear proyecto</button>
    </form>

    <div id="lista"><div class="vacio">Cargando…</div></div>
    <p class="ayuda">Haz clic en ▶ para ver las tareas de un proyecto. Doble clic sobre un nombre o tarea para editarlo (Enter guarda, Esc cancela).</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ===== DATOS DE SUPABASE =====
    const SUPABASE_URL = "https://aqjmdlrafjjzdrqnogid.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_EYSGo1Od8olfwv79ItxRzg_WDLfk1zf";
    // =============================

    const EQUIPO = ["Ariana", "Carlos", "Pierina", "Hilary"];
    const ESTADOS = { sin_empezar: "Sin empezar", en_curso: "En curso", listo: "Listo" };
    const PRIORIDADES = { alta: "Alta", media: "Media", baja: "Baja" };

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const lista = document.getElementById("lista");
    const conexion = document.getElementById("conexion");

    const proyectos = new Map();   // id -> proyecto
    const tareas = new Map();      // id -> tarea
    const abiertos = new Set();  // proyectos desplegados en esta pantalla
    let pendiente = false;       // hay cambios por pintar mientras alguien escribe

    const el = (tag, props = {}, ...hijos) => {
      const e = Object.assign(document.createElement(tag), props);
      e.append(...hijos);
      return e;
    };
    const revisar = ({ error }) => { if (error) alert("Error: " + error.message); };
    const guardarProyecto = (id, cambios) => db.from("proyectos").update(cambios).eq("id", id).then(revisar);
    const guardarTarea = (id, cambios) => db.from("tareas").update(cambios).eq("id", id).then(revisar);
    const porFecha = (a, b) => a.created_at.localeCompare(b.created_at);

    // No repintar mientras alguien escribe; se pinta al salir del campo
    function escribiendo() {
      const a = document.activeElement;
      return a && a.tagName === "INPUT" && a.type === "text" && lista.contains(a);
    }
    document.addEventListener("focusout", () => setTimeout(() => { if (pendiente) pintar(); }, 0));

    function anillo(pct) {
      const r = 15, c = 2 * Math.PI * r;
      const color = pct === 100 ? "#16a34a" : "#2563eb";
      const svg = `<svg class="anillo" width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="4"/>
        <circle cx="20" cy="20" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}" transform="rotate(-90 20 20)"
          style="transition: stroke-dashoffset .3s"/>
        <text x="20" y="23.5" text-anchor="middle">${pct}%</text></svg>`;
      return el("span", { innerHTML: svg, title: "Progreso" });
    }

    function editarEnLinea(span, valorActual, alGuardar) {
      const input = el("input", { type: "text", value: valorActual });
      input.style.flex = "1";
      span.replaceWith(input);
      input.focus();
      input.select();
      let listo = false;
      const terminar = (guardar) => {
        if (listo) return;
        listo = true;
        const nuevo = input.value.trim();
        if (guardar && nuevo && nuevo !== valorActual) alGuardar(nuevo);
        pendiente = true;
        input.blur();
        pintar();
      };
      input.onkeydown = (e) => {
        if (e.key === "Enter") terminar(true);
        if (e.key === "Escape") terminar(false);
      };
      input.onblur = () => terminar(true);
    }

    function selector(opciones, valor, clase, alCambiar) {
      const s = el("select", { className: clase + valor });
      for (const [k, v] of Object.entries(opciones)) s.append(el("option", { value: k, textContent: v, selected: k === valor }));
      s.onchange = () => alCambiar(s.value);
      return s;
    }

    function prop(titulo, control) {
      return el("div", { className: "prop" }, el("label", { textContent: titulo }), control);
    }

    function pintarProyecto(p) {
      const suyas = [...tareas.values()].filter((t) => t.proyecto_id === p.id).sort(porFecha);
      const hechas = suyas.filter((t) => t.hecha).length;
      const pct = suyas.length ? Math.round((hechas / suyas.length) * 100) : 0;
      const abierto = abiertos.has(p.id);

      const caja = el("div", { className: "proyecto" + (abierto ? " abierto" : "") });

      // Cabecera
      const flecha = el("button", { className: "flecha", textContent: "▶", title: "Ver tareas" });
      flecha.onclick = () => { abierto ? abiertos.delete(p.id) : abiertos.add(p.id); pintar(); };
      const nombre = el("div", { className: "nombre", textContent: p.nombre },
        el("small", { textContent: suyas.length ? `${hechas} de ${suyas.length} tareas hechas` : "Sin tareas" }));
      nombre.ondblclick = () => editarEnLinea(nombre, p.nombre, (v) => guardarProyecto(p.id, { nombre: v }));
      const borrar = el("button", { className: "icono", textContent: "✕", title: "Borrar proyecto" });
      borrar.onclick = () => {
        if (confirm(`¿Borrar el proyecto "${p.nombre}" y todas sus tareas?`))
          db.from("proyectos").delete().eq("id", p.id).then(revisar);
      };
      caja.append(el("div", { className: "cabecera" }, flecha, anillo(pct), nombre, borrar));

      // Propiedades
      const estado = selector(ESTADOS, p.estado, "estado-", (v) => guardarProyecto(p.id, { estado: v }));
      const prioridad = selector(PRIORIDADES, p.prioridad, "prio-", (v) => guardarProyecto(p.id, { prioridad: v }));

      const personas = el("div", { className: "personas" });
      for (const nombrePersona of EQUIPO) {
        const activa = p.encargados.includes(nombrePersona);
        const b = el("button", { className: "persona" + (activa ? " activa" : ""), textContent: nombrePersona, type: "button" });
        b.onclick = () => {
          const nuevos = activa ? p.encargados.filter((n) => n !== nombrePersona) : [...p.encargados, nombrePersona];
          guardarProyecto(p.id, { encargados: nuevos });
        };
        personas.append(b);
      }

      const fecha = el("input", { type: "date", value: p.fecha_limite || "" });
      const hoy = new Date().toISOString().slice(0, 10);
      if (p.fecha_limite && p.fecha_limite < hoy && p.estado !== "listo") { fecha.className = "vencida"; fecha.title = "Fecha vencida"; }
      fecha.onchange = () => guardarProyecto(p.id, { fecha_limite: fecha.value || null });

      caja.append(el("div", { className: "propiedades" },
        prop("Estado", estado), prop("Prioridad", prioridad), prop("Encargados", personas), prop("Fecha límite", fecha)));

      // Tareas
      if (abierto) {
        const ul = el("ul");
        for (const t of suyas) {
          const check = el("input", { type: "checkbox", checked: t.hecha });
          check.onchange = () => guardarTarea(t.id, { hecha: check.checked });
          const texto = el("span", { className: "texto", textContent: t.texto });
          texto.ondblclick = () => editarEnLinea(texto, t.texto, (v) => guardarTarea(t.id, { texto: v }));
          const quitar = el("button", { className: "icono", textContent: "✕", title: "Borrar tarea" });
          quitar.onclick = () => db.from("tareas").delete().eq("id", t.id).then(revisar);
          ul.append(el("li", { className: t.hecha ? "hecha" : "" }, check, texto, quitar));
        }
        const input = el("input", { type: "text", placeholder: "Nueva tarea…", autocomplete: "off", required: true });
        const form = el("form", {}, input, el("button", { className: "chico", textContent: "Agregar", type: "submit" }));
        form.onsubmit = async (e) => {
          e.preventDefault();
          const texto = input.value.trim();
          if (!texto) return;
          input.value = "";
          revisar(await db.from("tareas").insert({ proyecto_id: p.id, texto }));
          input.focus();
        };
        caja.append(el("div", { className: "tareas" }, ul, form));
      }
      return caja;
    }

    function pintar() {
      if (escribiendo()) { pendiente = true; return; }
      pendiente = false;
      const ordenados = [...proyectos.values()].sort(porFecha);
      lista.innerHTML = "";
      if (!ordenados.length) { lista.innerHTML = '<div class="vacio">No hay proyectos todavía. Crea el primero arriba.</div>'; return; }
      for (const p of ordenados) lista.append(pintarProyecto(p));
    }

    document.getElementById("nuevoProyecto").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("nombreProyecto");
      const nombre = input.value.trim();
      if (!nombre) return;
      input.value = "";
      const { data, error } = await db.from("proyectos").insert({ nombre }).select().single();
      if (error) return revisar({ error });
      abiertos.add(data.id);
      proyectos.set(data.id, data);
      pintar();
    };

    function alCambiar(mapa) {
      return (cambio) => {
        if (cambio.eventType === "DELETE") mapa.delete(cambio.old.id);
        else mapa.set(cambio.new.id, cambio.new);
        if (mapa === proyectos && cambio.eventType === "DELETE") {
          for (const [id, t] of tareas) if (t.proyecto_id === cambio.old.id) tareas.delete(id);
        }
        pintar();
      };
    }

    async function cargar() {
      const [p, t] = await Promise.all([db.from("proyectos").select("*"), db.from("tareas").select("*")]);
      const error = p.error || t.error;
      if (error) { lista.innerHTML = '<div class="vacio">Error: ' + error.message + "</div>"; return; }
      proyectos.clear(); p.data.forEach((x) => proyectos.set(x.id, x));
      tareas.clear(); t.data.forEach((x) => tareas.set(x.id, x));
      pintar();
    }

    db.channel("cambios")
      .on("postgres_changes", { event: "*", schema: "public", table: "proyectos" }, alCambiar(proyectos))
      .on("postgres_changes", { event: "*", schema: "public", table: "tareas" }, alCambiar(tareas))
      .subscribe((s) => {
        const ok = s === "SUBSCRIBED";
        conexion.className = "estado-conexion" + (ok ? " ok" : "");
        conexion.lastChild.textContent = ok ? "En vivo" : "Reconectando…";
        if (ok) cargar(); // recargar al (re)conectar para no perder cambios
      });
  </script>
</body>
</html>
